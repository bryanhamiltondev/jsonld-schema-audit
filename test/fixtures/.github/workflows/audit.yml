name: Schema Audit CI
on: [push, pull_request]
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Good fixture must pass
        run: php audit.php tests/fixtures/good.html
      - name: Broken fixture must fail
        run: |
          if php audit.php tests/fixtures/broken.html; then
            echo "ERROR: broken fixture passed audit"; exit 1
          else
            echo "OK: broken fixture correctly rejected"
          fi
